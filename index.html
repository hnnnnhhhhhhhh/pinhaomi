<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1e8de"><title>拼好咪 · make cat cute</title><link rel="preload" href="assets/pinhaomi-wordmark-v2.png" as="image"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="typography.css"><link rel="stylesheet" href="cover-motion.css"><link rel="stylesheet" href="editor-layout.css"></head><body>
<header class="topbar"><button class="brand" id="home" aria-label="回到拼好咪封面"><span class="brand-dot" aria-hidden="true"></span>拼好咪</button><div class="editor-actions" id="headerActions" hidden><button id="demo" class="pill ghost">随机拼</button><button id="export" class="pill primary">导出</button></div></header>
<main id="cover"><section class="cover-hero" aria-labelledby="cover-title"><h1 id="cover-title"><span>拼</span><span>好</span><span>咪</span><i class="cover-spark" aria-hidden="true">✳</i></h1><p class="cover-english">make cat cute</p><div class="fur-parade" aria-hidden="true"><div class="paper-arrow">挑一点喜欢的<br><span>↘</span></div><div class="fur-character orange"><div class="fur-shape"></div><img class="eye a" src="assets/photo02-eye-a.svg" alt=""><img class="eye b" src="assets/photo02-eye-b.svg" alt=""><img class="nose" src="assets/photo10-nose.svg" alt=""></div><span class="pink-loop"></span><div class="fur-character gray"><div class="fur-shape"></div><img class="eye a" src="assets/photo10-eye-a.svg" alt=""><img class="eye b" src="assets/photo10-eye-b.svg" alt=""><img class="nose" src="assets/photo13-nose.svg" alt=""></div><span class="little-star">✳</span><div class="fur-character white"><div class="fur-shape"></div><img class="eye a" src="assets/photo06-eye-a.svg" alt=""><img class="eye b" src="assets/photo06-eye-b.svg" alt=""><img class="nose" src="assets/photo14-nose.svg" alt=""></div><div class="paper-label">100% 真猫素材<br>0% 标准答案</div></div><button id="start" class="pill primary start">开始拼咪</button></section><footer class="cover-footer"><span>猫毛可以撞色，眼睛可以不成对。</span><span>MADE OF CATS. MADE BY YOU.</span></footer></main>
<main id="editor" hidden><div class="collage-desk"><aside class="library" aria-label="猫咪部件素材库"><div class="library-title"><h2>来拼个咪</h2><span id="assetCount"></span></div><p class="library-hint">点击添加，或拖到右边。</p><div id="filters" class="filters" aria-label="按部件筛选"></div><div id="inventory" class="inventory"></div><div class="library-bottom"><span class="tiny-fur"></span>每一片都来自真实的小猫。</div></aside><section class="studio" aria-label="拼贴工作台"><div class="canvas-surround"><div id="board" tabindex="0" aria-label="拼贴画布。选中部件后可用方向键移动，Delete 删除。"><div id="empty"><div class="empty-shape" aria-hidden="true"></div><p>这里还差一只，你的咪。</p><span>从左边选一个脑袋开始，也可以随便来。</span></div></div><div class="canvas-caption"><span id="saveStatus">自由拼贴中</span><span>拖动 · 叠放 · 不用对齐</span></div></div><div id="toolbar" class="toolbar"><span id="selection">选中一片，慢慢捣鼓。</span><div class="edit-controls"><label>大小<input id="size" type="range" min="20" max="520" value="160"></label><label>旋转<input id="rotation" type="range" min="-180" max="180" value="0"></label><button id="flip">翻转</button><button id="front">置顶</button><button id="back">置底</button><button id="remove">移除</button></div></div><div class="desk-bottom"><div class="backgrounds" aria-label="选择画布底色"><span>底纸</span><button class="swatch active" data-color="transparent" aria-label="透明底纸"></button><button class="swatch" data-color="#ffffff" style="--swatch:#ffffff" aria-label="白色底纸"></button></div><div><button id="undo" class="text-button">↶ 撤销</button><button id="clear" class="text-button">清空画布</button></div></div></section></div></main><div id="toast" role="status" aria-live="polite"></div>

<script src="catalog.js"></script><script src="personal-data.js"></script><script src="cat-composer.js"></script><script src="editor.js"></script><script src="cover-motion.js"></script></body></html>
